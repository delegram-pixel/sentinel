name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, types, unit tests, build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check formatting
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Validate Prisma schema
        run: yarn db:validate

      - name: Unit tests
        run: yarn test

      - name: Production build
        run: yarn build

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_DATABASE_URL: postgresql://sentinel:sentinel@127.0.0.1:5432/sentinel_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Apply migrations and run integration tests
        run: yarn test:integration

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browser
        run: yarn playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: yarn test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy production to Vercel
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [quality, integration, e2e]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Validate deployment secrets
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        shell: bash
        run: |
          deployment_secrets_missing=0
          for deployment_secret_name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID DIRECT_URL; do
            deployment_secret_value="${!deployment_secret_name:-}"
            if [[ -z "${deployment_secret_value//[[:space:]]/}" ]]; then
              echo "::error::${deployment_secret_name} is missing or blank. Add it in GitHub Settings > Secrets and variables > Actions, or in the production environment secrets."
              deployment_secrets_missing=1
            fi
          done
          exit "$deployment_secrets_missing"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Pull project settings and build variables. Vercel Secret values are
      # redacted in this export, so migrations use the GitHub DIRECT_URL secret.
      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Apply production database migrations
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from "node:child_process";
          import { createProductionMigrationEnv } from "./scripts/production-migration-env.mjs";

          try {
            const result = spawnSync("yarn", ["db:deploy"], {
              stdio: "inherit",
              env: createProductionMigrationEnv(process.env),
            });
            if (result.error) throw result.error;
            process.exitCode = result.status ?? 1;
          } catch (error) {
            console.error(`::error::${error.message}`);
            console.error("Migration DIRECT_URL is loaded from GitHub Actions secrets in the production environment. Set it to the raw direct Neon URL for the production database, then rerun the deploy job.");
            process.exitCode = 1;
          }
          NODE

      - name: Build Vercel output
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        run: echo "Deployed production to ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
